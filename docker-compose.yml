services:
  flux-tiny-url:
    build:
      context: ./tiny-url
    image: flux-tiny-url:latest
    container_name: flux-tiny-url
    restart: unless-stopped
    env_file:
      - ./tiny-url/.env
    ports:
      - '127.0.0.1:4100:4100'
    volumes:
      - flux-tiny-url-data:/data
    networks:
      - flux-fileshare
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http=require('http');const req=http.get({host:'127.0.0.1',port:process.env.PORT||4100,path:'/healthz',timeout:3000},res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.on('timeout',()=>{req.destroy();process.exit(1);});",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  flux-relay:
    build:
      context: ./relay
    image: flux-fileshare-relay:latest
    container_name: flux-fileshare-relay
    restart: unless-stopped
    env_file:
      - ./relay/.env
    depends_on:
      flux-tiny-url:
        condition: service_healthy
    ports:
      - '127.0.0.1:4444:4444'
    networks:
      - flux-fileshare
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http=require('http');const req=http.get({host:'127.0.0.1',port:process.env.PUBLIC_PORT||4444,path:'/healthz',timeout:3000},res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.on('timeout',()=>{req.destroy();process.exit(1);});",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  flux-tiny-url-data:

networks:
  flux-fileshare:
    name: flux-fileshare
    driver: bridge
